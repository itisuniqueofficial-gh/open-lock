version: 2
# Controlled, weekly dependency update PRs. Updates are proposed as PRs (which
# run CI) and are NOT auto-merged — a human reviews and merges. Version bumps
# must keep the app buildable on the pinned Flutter/toolchain.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "dart"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "gradle"]
    commit-message:
      prefix: "deps(gradle)"
