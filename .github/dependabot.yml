version: 2
# Controlled, weekly dependency update PRs. Minor/patch updates are grouped into
# a single PR per ecosystem to reduce noise; each PR runs CI and is NOT
# auto-merged — a human reviews and merges. Major bumps of the Flutter-coupled
# Android toolchain are ignored (they must track the Flutter SDK, not Dependabot).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "dart"]
    commit-message:
      prefix: "deps"
    groups:
      dart-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "gradle"]
    commit-message:
      prefix: "deps(gradle)"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Android Gradle Plugin and Kotlin track the pinned Flutter SDK; major
      # bumps are handled deliberately alongside a Flutter upgrade, not by bot.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
