name: Release

# Builds signed APKs + an AAB and publishes them to a GitHub Release.
# Triggers ONLY on version tags and manual dispatch — never on pull requests —
# so forks can never reach the signing secrets. No release is published unless
# every validation step succeeds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      label:
        description: "Version label for a manual build (e.g. v1.5.0)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.3"
  APP_ID: "com.itisuniqueofficial.openlock"
  APP_LABEL: "Open Lock"

jobs:
  release:
    name: Build · Sign · Verify · Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve and validate version / tag
        id: ver
        run: |
          set -e
          VER="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.label }}" ]; then
            VER="${{ github.event.inputs.label }}"
          fi
          [ -z "$VER" ] && VER="dev"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # Canonical version comes from pubspec.yaml: versionName+versionCode.
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          echo "pubspec_version=$PUBSPEC_VER" >> "$GITHUB_OUTPUT"
          echo "pubspec_build=$PUBSPEC_BUILD" >> "$GITHUB_OUTPUT"

          # For a real tag build, the tag must be v<pubspec version>. This blocks
          # any tag/version mismatch before anything is built.
          if [ "${{ github.event_name }}" = "push" ]; then
            case "$VER" in
              v[0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::tag '$VER' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
            esac
            if [ "${VER#v}" != "$PUBSPEC_VER" ]; then
              echo "::error::tag ${VER} != pubspec version v${PUBSPEC_VER}"; exit 1
            fi
          fi
          echo "Building $VER (versionName=$PUBSPEC_VER versionCode=$PUBSPEC_BUILD)"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify launcher icons present
        run: |
          set -e
          test -s icons/icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            test -s "android/app/src/main/res/drawable-$d/ic_launcher_foreground.png"
          done
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS in repo Settings → Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > android/key.properties

      - name: Build signed universal + split APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Collect artifacts
        id: collect
        run: |
          set -e
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Open-Lock-${VER}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$f" ] && cp "$f" "dist/Open-Lock-${VER}-${abi}.apk"
          done
          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB" ]; then
            echo "::error::AAB not found or empty at $AAB"; exit 1
          fi
          cp "$AAB" "dist/Open-Lock-${VER}-release.aab"
          ls -lh dist

      - name: Verify signature, package, label, version, versionCode
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          UAPK="dist/Open-Lock-${{ steps.ver.outputs.version }}-universal.apk"

          echo "== apksigner verify =="
          "$APKSIGNER" verify --print-certs "$UAPK" | head -5
          "$APKSIGNER" verify "$UAPK" || { echo "::error::APK is not validly signed"; exit 1; }

          if [ -x "$BT/aapt" ]; then BADGING=$("$BT/aapt" dump badging "$UAPK"); else BADGING=$("$BT/aapt2" dump badging "$UAPK"); fi
          PKG=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          VN=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          LABEL=$(echo "$BADGING" | sed -n "s/.*application-label:'\([^']*\)'.*/\1/p")
          echo "package=$PKG versionName=$VN versionCode=$VC label=$LABEL"

          [ "$PKG" = "${APP_ID}" ] || { echo "::error::package $PKG != ${APP_ID}"; exit 1; }
          [ "$LABEL" = "${APP_LABEL}" ] || { echo "::error::label $LABEL != ${APP_LABEL}"; exit 1; }
          [ "$VN" = "${{ steps.ver.outputs.pubspec_version }}" ] || { echo "::error::versionName $VN != ${{ steps.ver.outputs.pubspec_version }}"; exit 1; }
          [ "$VC" = "${{ steps.ver.outputs.pubspec_build }}" ] || { echo "::error::versionCode $VC != ${{ steps.ver.outputs.pubspec_build }}"; exit 1; }

      - name: Verify AAB is a valid zip
        run: |
          set -e
          AAB="dist/Open-Lock-${{ steps.ver.outputs.version }}-release.aab"
          unzip -l "$AAB" >/dev/null || { echo "::error::AAB is not a valid archive"; exit 1; }
          unzip -l "$AAB" | grep -q "AndroidManifest" && echo "AAB OK"

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "## Open Lock ${{ steps.ver.outputs.version }}"
            echo ""
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              echo ""
              git log --no-merges --pretty="- %s (%h)" "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "Initial tagged release."
              echo ""
              git log --no-merges --pretty="- %s (%h)" -n 30
            fi
            echo ""
            echo "### Install"
            echo "- Most phones: \`Open-Lock-${{ steps.ver.outputs.version }}-arm64-v8a.apk\`"
            echo "- Unsure: \`Open-Lock-${{ steps.ver.outputs.version }}-universal.apk\`"
            echo "- Play Store upload: \`Open-Lock-${{ steps.ver.outputs.version }}-release.aab\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.keystore

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: open-lock-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Lock ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
