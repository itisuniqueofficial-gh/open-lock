name: CI

# Runs on every push and pull request. Fails the build on any formatting,
# analysis, or test error (no silent skips).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.3"

jobs:
  verify:
    name: Format · Analyze · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify launcher icons present
        run: |
          set -e
          test -s icons/icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            test -s "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            test -s "android/app/src/main/res/drawable-$d/ic_launcher_foreground.png"
          done
          test -s android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "launcher icon resources present"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-lock-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
