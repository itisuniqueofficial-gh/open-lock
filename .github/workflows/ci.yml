name: CI

# Runs on pushes to main and on every pull request. Feature branches get CI via
# their PR (avoids duplicate runs). Fails on any formatting, analysis, test,
# build, or repository-hygiene error — nothing is hidden. Releases are never
# produced here (see release.yml, tag-triggered only).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.3"
  APP_ID: "com.itisuniqueofficial.openlock"
  APP_LABEL: "Open Lock"

jobs:
  guards:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No old identifiers, no committed secrets, required assets present
        run: |
          fail=0
          # No old package id (PROJECT_SUMMARY documents the migration, so skip it).
          if grep -RIn --exclude-dir=.git --exclude=PROJECT_SUMMARY.md 'dev\.abdullah\.openlock' .; then
            echo "::error::old package id dev.abdullah.openlock found"; fail=1; fi
          # No old repository reference.
          if grep -RIn --exclude-dir=.git --exclude=PROJECT_SUMMARY.md 'MalicKAbdullah/openlock' .; then
            echo "::error::old repository reference MalicKAbdullah/openlock found"; fail=1; fi
          # No signing material committed.
          if git ls-files | grep -E '(^|/)key\.properties$|\.jks$|\.keystore$'; then
            echo "::error::signing material must never be committed"; fail=1; fi
          # Required assets / config.
          test -s icons/icon.png || { echo "::error::master icon icons/icon.png missing"; fail=1; }
          test -f .github/workflows/release.yml || { echo "::error::release workflow missing"; fail=1; }
          grep -q "applicationId = \"${APP_ID}\"" android/app/build.gradle.kts || { echo "::error::applicationId != ${APP_ID}"; fail=1; }
          grep -q "android:label=\"${APP_LABEL}\"" android/app/src/main/AndroidManifest.xml || { echo "::error::app label != ${APP_LABEL}"; fail=1; }
          exit $fail

  verify:
    name: Format · Analyze · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify launcher icons present
        run: |
          set -e
          test -s icons/icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            test -s "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            test -s "android/app/src/main/res/drawable-$d/ic_launcher_foreground.png"
          done
          test -s android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "launcher icon resources present"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK package and label
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          if [ -x "$BT/aapt" ]; then BADGING=$("$BT/aapt" dump badging "$APK"); else BADGING=$("$BT/aapt2" dump badging "$APK"); fi
          echo "$BADGING" | grep -E "package:|application-label:" | head -2
          echo "$BADGING" | grep -q "package: name='${APP_ID}'" || { echo "::error::debug APK package != ${APP_ID}"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'${APP_LABEL}'" || { echo "::error::debug APK label != ${APP_LABEL}"; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-lock-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
