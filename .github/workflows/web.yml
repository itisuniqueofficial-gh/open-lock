name: Website

# Builds the static site in /web (Tailwind + release data) and deploys it to
# GitHub Pages. PRs build + validate only (no deploy). Requires GitHub Pages to
# be enabled for the repository (Settings → Pages → Source: GitHub Actions);
# Pages for a private repo needs a plan that supports it, or make the repo public.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build · Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (release data + Tailwind CSS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Validate site
        run: npm run check

      - name: Assemble deployable site
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _site
          mkdir _site
          cp -r *.html CNAME robots.txt sitemap.xml site.webmanifest assets data _site/
          echo "Assembled $(find _site -type f | wc -l) files for Pages"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
